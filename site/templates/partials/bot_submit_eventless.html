<form
  hx-boost="true"
  action="/submit-bot"
  method="post"
>
  <label for="game-selector">select bot to enter into the event</label>
  <select name="game-selector" id="game-selector">
  {% for game in games %}
    <option value="{{ game.id }}">{{ game.name }}</option>
  {% endfor %}
  </select>
  <label for="bot">Chose file to upload:</label><br>
  <input type="file" name="bot" id="bot" multiple="false" accept=".wasm"/><br>
  <input type="submit">
</form>
